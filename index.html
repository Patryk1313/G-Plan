<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G-Plan | Kalendarz Treningowy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #080a0c;
      --card: rgba(19, 25, 33, 0.72);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #eef3f7;
      --muted: #9aa7b6;
      --accent: #4ade80;
      --accent-soft: rgba(74, 222, 128, 0.14);
      --off: rgba(136, 148, 163, 0.18);
      --off-text: #7f8a99;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.38);
      --radius-xl: 1.4rem;
      --radius-lg: 1.1rem;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Manrope", sans-serif;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background-image:
        radial-gradient(920px 560px at 12% -8%, rgba(74, 222, 128, 0.16), transparent 58%),
        radial-gradient(720px 460px at 100% 4%, rgba(56, 189, 248, 0.11), transparent 54%),
        linear-gradient(180deg, #080a0c 0%, #0a0e13 100%);
      overflow-x: hidden;
    }

    .glass {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: rgba(16, 22, 30, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: var(--shadow);
    }

    .timeline-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 1rem;
      width: 2px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(74, 222, 128, 0.45), rgba(122, 162, 255, 0.1));
    }

    .day-dot {
      width: 0.8rem;
      height: 0.8rem;
      border-radius: 999px;
      flex-shrink: 0;
      margin-top: 0.45rem;
      box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.09);
      background: var(--accent);
    }

    .off .day-dot {
      background: #94a3b8;
      box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.12);
    }

    .training-card {
      border-radius: var(--radius-lg);
      border: 1px solid var(--card-border);
      background: var(--card);
      transition: transform 220ms ease, border-color 220ms ease, box-shadow 220ms ease, background-color 220ms ease;
      animation: riseIn 420ms ease both;
    }

    .training-card:hover {
      transform: translateY(-2px);
      border-color: rgba(74, 222, 128, 0.36);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
    }

    .training-card.off {
      background: var(--off);
      border-color: rgba(148, 163, 184, 0.18);
      color: var(--off-text);
    }

    .chip {
      border-radius: 999px;
      border: 1px solid rgba(74, 222, 128, 0.38);
      background: var(--accent-soft);
      color: #bef8cf;
      font-size: 0.73rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 0.3rem 0.62rem;
      text-transform: uppercase;
    }

    .chip.off {
      border-color: rgba(148, 163, 184, 0.32);
      background: rgba(148, 163, 184, 0.1);
      color: #c9d2dc;
    }

    .time-field {
      width: 100%;
      border-radius: 0.8rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(10, 14, 20, 0.8);
      color: var(--text);
      font-weight: 600;
      padding: 0.62rem 0.72rem;
      transition: border-color 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
    }

    .time-field:focus {
      outline: none;
      border-color: rgba(74, 222, 128, 0.62);
      box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.14);
      background: rgba(11, 16, 24, 0.96);
    }

    .download-btn {
      border: 1px solid rgba(74, 222, 128, 0.5);
      border-radius: var(--radius-xl);
      background:
        linear-gradient(180deg, rgba(74, 222, 128, 0.24), rgba(74, 222, 128, 0.1)),
        rgba(10, 16, 22, 0.9);
      color: #ecfff3;
      font-weight: 800;
      letter-spacing: 0.01em;
      padding: 0.95rem 1.2rem;
      width: 100%;
      transition: transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease;
      box-shadow: 0 15px 36px rgba(0, 0, 0, 0.34);
    }

    .download-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(74, 222, 128, 0.8);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.4);
    }

    .download-btn:active {
      transform: translateY(0);
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 640px) {
      .timeline-line {
        left: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <main class="mx-auto max-w-4xl px-4 py-6 sm:py-10">
    <section class="glass rounded-[1.6rem] p-5 sm:p-7">
      <header class="mb-6 sm:mb-8">
        <p class="mb-2 text-xs font-semibold uppercase tracking-[0.2em] text-emerald-300/90">G-Plan</p>
        <h1 class="text-2xl font-extrabold tracking-tight sm:text-4xl">Kalendarz treningowy 4 tygodnie</h1>
        <p class="mt-2 max-w-2xl text-sm text-slate-300/85 sm:text-base">
          Dynamiczny plan 28 dni od dziś. Ustaw godziny dla każdego treningu i pobierz gotowy plik .ics.
        </p>
      </header>

      <div id="calendar" class="relative pl-7 sm:pl-8">
        <span class="timeline-line" aria-hidden="true"></span>
        <div id="daysContainer" class="space-y-3"></div>
      </div>

      <footer class="mt-8 sm:mt-10">
        <button id="downloadIcs" type="button" class="download-btn text-base sm:text-lg">
          Pobierz plik kalendarza (.ics)
        </button>
        <p class="mt-3 text-xs text-slate-400">
          Wydarzenia OFF są widoczne w planie, ale eksport obejmuje tylko dni treningowe.
        </p>
      </footer>
    </section>
  </main>

  <script>
    const WORKOUT_ROTATION = ["Push", "Pull", "Wolne", "Legs", "Push", "Wolne", "Pull"];
    const DAYS_TOTAL = 28;

    const triviaBank = [
      "Objętość treningowa (Volume) to całkowita liczba uniesionych kilogramów: serie x powtórzenia x ciężar. To jeden z głównych motorów hipertrofii.",
      "Hipertrofia to wzrost komórek mięśniowych, który wymaga bodźca mechanicznego i odpowiedniej podaży białka.",
      "RIR (Reps in Reserve) określa liczbę powtórzeń zapasu do załamania mięśniowego. RIR 1-2 często daje dobry balans między bodźcem a regeneracją.",
      "Układ nerwowy regeneruje się wolniej niż mięśnie, dlatego dni OFF są kluczowe dla progresu i jakości kolejnych sesji.",
      "Najsilniejszy sygnał hipertroficzny często pojawia się przy kontrolowanym rozciągnięciu mięśnia pod obciążeniem.",
      "Synteza białek mięśniowych rośnie po treningu siłowym, ale bez odpowiedniej ilości aminokwasów efekt jest ograniczony.",
      "Nawodnienie wpływa na siłę i wydolność. Spadek masy ciała o 1-2% przez odwodnienie potrafi obniżyć osiągi.",
      "Pompa mięśniowa nie jest jedynym wskaźnikiem jakości treningu, ale może sygnalizować dobrą pracę i ukrwienie mięśni.",
      "Progresja obciążenia może oznaczać nie tylko większy ciężar, ale też więcej powtórzeń, serii lub lepszą technikę.",
      "Zakres 6-15 powtórzeń bywa bardzo skuteczny w budowaniu masy mięśniowej, jeśli serie są prowadzone blisko upadku.",
      "Białko warto rozłożyć równomiernie w ciągu dnia, aby częściej aktywować syntezę białek mięśniowych.",
      "Sen krótszy niż 7 godzin przez dłuższy czas może obniżać regenerację i pogarszać adaptacje treningowe.",
      "Deload to zaplanowane obniżenie objętości lub intensywności, które pozwala odświeżyć układ nerwowy i stawy.",
      "Technika ruchu ma pierwszeństwo przed ciężarem. Stabilna kontrola toru sztangi zmniejsza ryzyko kontuzji.",
      "Tempo ekscentryczne zwiększa czas pod napięciem i może poprawić kontrolę ruchu oraz czucie mięśniowe.",
      "Dodatni bilans energetyczny ułatwia budowanie masy, ale jego skala powinna być umiarkowana, by ograniczyć przyrost tkanki tłuszczowej.",
      "Węglowodany pomagają uzupełniać glikogen mięśniowy, co wspiera jakość kolejnych sesji siłowych.",
      "Dłuższe przerwy między seriami złożonych ćwiczeń często poprawiają jakość kolejnych serii i łączną objętość.",
      "Regularne monitorowanie serii roboczych i RIR ułatwia obiektywne planowanie progresji tydzień po tygodniu.",
      "Regeneracja aktywna, spacer i lekka mobilność w dni OFF mogą poprawić samopoczucie bez przeciążania organizmu."
    ];

    const daysContainer = document.getElementById("daysContainer");
    const downloadBtn = document.getElementById("downloadIcs");

    const planDays = [];

    function formatDateLabel(dateObj) {
      return new Intl.DateTimeFormat("pl-PL", {
        weekday: "short",
        day: "2-digit",
        month: "short"
      }).format(dateObj);
    }

    function formatDateForIcs(dateObj) {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, "0");
      const day = String(dateObj.getDate()).padStart(2, "0");
      return `${year}${month}${day}`;
    }

    function normalizeTime(value, fallback) {
      if (!value || !/^\d{2}:\d{2}$/.test(value)) {
        return fallback;
      }
      return value;
    }

    function escapeIcsText(raw) {
      return raw
        .replace(/\\/g, "\\\\")
        .replace(/;/g, "\\;")
        .replace(/,/g, "\\,")
        .replace(/\n/g, "\\n");
    }

    function uidFromDay(dayPlan, index) {
      const stamp = `${dayPlan.isoDate}-${index}-${dayPlan.type}`.replace(/[^0-9A-Za-z-]/g, "");
      return `${stamp}@g-plan.local`;
    }

    function randomFact() {
      const i = Math.floor(Math.random() * triviaBank.length);
      return triviaBank[i];
    }

    function makeWorkoutCard(dayPlan, index) {
      const isOff = dayPlan.type === "Wolne";
      const wrapper = document.createElement("article");
      wrapper.className = `training-card ${isOff ? "off" : ""} flex items-start gap-3 px-4 py-4 sm:px-5 sm:py-5`;
      wrapper.style.animationDelay = `${index * 26}ms`;

      const weekNumber = Math.floor(index / 7) + 1;

      const html = `
        <span class="day-dot mt-2" aria-hidden="true"></span>
        <div class="min-w-0 flex-1">
          <div class="mb-3 flex flex-wrap items-center gap-2">
            <span class="chip ${isOff ? "off" : ""}">${isOff ? "Regeneracja" : dayPlan.type}</span>
            <span class="text-xs font-semibold uppercase tracking-[0.09em] text-slate-400">Tydzień ${weekNumber}</span>
          </div>
          <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
            <h2 class="text-lg font-semibold leading-tight ${isOff ? "text-slate-300" : "text-slate-100"}">${dayPlan.label}</h2>
            <span class="text-sm font-medium ${isOff ? "text-slate-400" : "text-slate-300"}">${dayPlan.fullDate}</span>
          </div>
          ${isOff ? `
            <p class="text-sm text-slate-400">Dzień OFF: odnowa układu nerwowego, mobilność i sen.</p>
          ` : `
            <div class="grid gap-3 sm:grid-cols-2">
              <label class="text-xs font-semibold uppercase tracking-[0.08em] text-slate-400">
                Godzina rozpoczęcia
                <input
                  type="time"
                  class="time-field mt-1.5"
                  value="${dayPlan.startTime}"
                  data-role="start"
                  data-index="${index}"
                />
              </label>
              <label class="text-xs font-semibold uppercase tracking-[0.08em] text-slate-400">
                Godzina zakończenia
                <input
                  type="time"
                  class="time-field mt-1.5"
                  value="${dayPlan.endTime}"
                  data-role="end"
                  data-index="${index}"
                />
              </label>
            </div>
          `}
        </div>
      `;

      wrapper.innerHTML = html;
      return wrapper;
    }

    function generatePlan() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      for (let i = 0; i < DAYS_TOTAL; i += 1) {
        const dateObj = new Date(today);
        dateObj.setDate(today.getDate() + i);

        const type = WORKOUT_ROTATION[i % WORKOUT_ROTATION.length];

        planDays.push({
          index: i,
          dateObj,
          isoDate: formatDateForIcs(dateObj),
          type,
          label: `Dzień ${i + 1}`,
          fullDate: formatDateLabel(dateObj),
          startTime: "17:00",
          endTime: "18:30"
        });
      }
    }

    function renderPlan() {
      const fragment = document.createDocumentFragment();
      planDays.forEach((day, idx) => {
        fragment.appendChild(makeWorkoutCard(day, idx));
      });
      daysContainer.appendChild(fragment);
    }

    function bindTimeInputs() {
      daysContainer.addEventListener("input", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLInputElement)) {
          return;
        }

        const role = target.dataset.role;
        const dayIndex = Number(target.dataset.index);
        if (Number.isNaN(dayIndex) || !planDays[dayIndex] || !role) {
          return;
        }

        if (role === "start") {
          planDays[dayIndex].startTime = normalizeTime(target.value, "17:00");
        }

        if (role === "end") {
          planDays[dayIndex].endTime = normalizeTime(target.value, "18:30");
        }
      });
    }

    function buildIcsContent() {
      const now = new Date();
      const stamp = `${now.getUTCFullYear()}${String(now.getUTCMonth() + 1).padStart(2, "0")}${String(now.getUTCDate()).padStart(2, "0")}T${String(now.getUTCHours()).padStart(2, "0")}${String(now.getUTCMinutes()).padStart(2, "0")}${String(now.getUTCSeconds()).padStart(2, "0")}Z`;

      const lines = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//G-Plan//Training Calendar//PL",
        "CALSCALE:GREGORIAN",
        "METHOD:PUBLISH"
      ];

      planDays.forEach((day, idx) => {
        if (day.type === "Wolne") {
          return;
        }

        const start = normalizeTime(day.startTime, "17:00");
        const end = normalizeTime(day.endTime, "18:30");
        const startIcs = `${day.isoDate}T${start.replace(":", "")}00`;
        const endIcs = `${day.isoDate}T${end.replace(":", "")}00`;

        const summary = escapeIcsText(`Trening ${day.type}`);
        const description = escapeIcsText(`💡 Ciekawostka treningowa:\n${randomFact()}`);

        lines.push("BEGIN:VEVENT");
        lines.push(`UID:${uidFromDay(day, idx)}`);
        lines.push(`DTSTAMP:${stamp}`);
        lines.push(`DTSTART:${startIcs}`);
        lines.push(`DTEND:${endIcs}`);
        lines.push(`SUMMARY:${summary}`);
        lines.push(`DESCRIPTION:${description}`);
        lines.push("END:VEVENT");
      });

      lines.push("END:VCALENDAR");
      return `${lines.join("\r\n")}\r\n`;
    }

    function downloadIcsFile() {
      const icsContent = buildIcsContent();
      const blob = new Blob([icsContent], { type: "text/calendar;charset=utf-8" });

      if (navigator.msSaveOrOpenBlob) {
        navigator.msSaveOrOpenBlob(blob, "g-plan-4-tygodnie.ics");
        return;
      }

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "g-plan-4-tygodnie.ics";
      link.style.display = "none";
      document.body.appendChild(link);
      link.click();

      setTimeout(() => {
        URL.revokeObjectURL(url);
        link.remove();
      }, 120);
    }

    downloadBtn.addEventListener("click", downloadIcsFile);

    generatePlan();
    renderPlan();
    bindTimeInputs();
  </script>
</body>
</html>
